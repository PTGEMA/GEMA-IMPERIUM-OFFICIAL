name: GEMA-OPERASI-CUAN-V1
on: [push, workflow_dispatch]
jobs:
  eksekusi_intelijen:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: "1. Jalankan Otak Utama PT GEMA"
        run: python otak_gema_ai.py

      - name: "2. Aktifkan Penyedot AI Global"
        run: python gema_chip_supremasi.py
